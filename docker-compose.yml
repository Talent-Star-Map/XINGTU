services:
  mysql:
    image: mysql:8.0
    container_name: xingtu-mysql
    environment:
      # 生产环境强密码（本地 Navicat 连接用）
      MYSQL_ROOT_PASSWORD: Xingtu123
      MYSQL_DATABASE: xingtu
    # 端口映射：宿主机 3308 → 容器 3306，让本地 Navicat 可以连接云服务器 MySQL
    # （3307 被占用，改用 3308）
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pXingtu123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: xingtu-api
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Docker 内部走容器名 mysql:3306（不是宿主机 3307）
      DATABASE_URL: mysql+pymysql://root:Xingtu123@mysql:3306/xingtu
      JWT_SECRET: xingtu-prod-secret-key-2026-very-long-and-random
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: xingtu-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
