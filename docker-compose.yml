services:
  mysql:
    image: mysql:8.0
    container_name: xingtu-mysql
    environment:
      # 生产环境强密码（本地 Navicat 连接用）
      MYSQL_ROOT_PASSWORD: Xingtu123
      MYSQL_DATABASE: xingtu
    # 端口映射：宿主机 3308 → 容器 3306，让本地 Navicat 可以连接云服务器 MySQL
    # （3307 被占用，改用 3308）
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pXingtu123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: xingtu-api
    ports:
      - "8081:8081"
    # 注意:不再 depends_on mysql — 直连云库 180.76.227.159:3308
    # DATABASE_URL / JWT_SECRET / FRONTEND_BASE_URL 全部从 backend/.env 读
    # (Dockerfile 已 COPY . . 把 .env 拷进容器)
    environment:
      # 简历导出 — Playwright 通过容器内 frontend 域名访问前端
      FRONTEND_BASE_URL: http://frontend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: xingtu-frontend
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
