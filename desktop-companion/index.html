<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' xiaoxing://media; img-src 'self' xiaoxing://media data:; media-src 'self' xiaoxing://media blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'none'">
<title>小星</title><link rel="stylesheet" href="pet.css">
<main><section id="panel" hidden aria-label="小星互动面板"><header><strong>小星</strong><button id="close" aria-label="关闭面板">×</button></header><p id="message" role="status">正在准备动作…</p><div class="actions"><button data-action="wave">打招呼</button><button data-action="eat">喂饭</button><button data-action="sleep">睡觉</button><button data-action="walk">散步</button></div><button id="wake" hidden>叫醒小星</button><button id="retry" hidden>重新载入动作</button><label><input type="checkbox" id="pause">安静模式 · 暂停动画</label><label><input type="checkbox" id="wander">偶尔自己散步</label><div class="sizes"><span>显示大小</span><button data-size="small">小</button><button data-size="medium">中</button><button data-size="large">大</button></div><button id="open-site" class="open-site" aria-label="打开星图">打开星图 ↗</button><footer><button id="corner">回到角落</button><button id="hide">收起</button><button id="quit">退出</button></footer></section><button id="character" aria-label="小星：点击互动，拖动可移动" aria-expanded="false"><img id="portrait" src="idle.png" alt=""><span id="video"></span></button><div id="badge" hidden>素材验证</div></main><script type="module" src="renderer.js"></script></html>
