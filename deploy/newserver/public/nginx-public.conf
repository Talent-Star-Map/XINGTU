log_format xingtu_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=xingtu_auth:8m rate=1r/s;
limit_req_zone $binary_remote_addr zone=xingtu_general:16m rate=30r/s;

upstream xingtu_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    server_name 47.120.76.16;
    ssl_certificate /data/xingtu/secrets/letsencrypt/live/xingtu-public-ip/fullchain.pem;
    ssl_certificate_key /data/xingtu/secrets/letsencrypt/live/xingtu-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XINGTU_TLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/xingtu.access.log xingtu_safe;
    error_log  /var/log/nginx/xingtu.error.log warn;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/auth/(login|admin/login|send-code|register)$ {
        limit_req zone=xingtu_auth burst=5 nodelay;
        proxy_pass http://xingtu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=xingtu_general burst=60 nodelay;
        proxy_pass http://xingtu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
 listen 80;
 listen [::]:80;
 server_name 47.120.76.16;
 server_tokens off;
 access_log /var/log/nginx/xingtu-http.access.log xingtu_safe;
 location ^~ /.well-known/acme-challenge/ { root /data/xingtu/acme-webroot; default_type text/plain; }
 location / { return 308 https://47.120.76.16$request_uri; }
}
